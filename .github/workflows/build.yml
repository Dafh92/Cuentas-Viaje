name: Compilar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CuentasDelViaje.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CuentasDelViaje-apk
          path: CuentasDelViaje.apk
      - name: Publicar como release (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Cuentas del viaje v${{ github.run_number }}
          files: CuentasDelViaje.apk
          make_latest: true
permissions:
  contents: write
